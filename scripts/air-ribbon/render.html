<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body{margin:0;background:#faf9f6}
  canvas{display:block;width:min(100vw,100vh);height:min(100vw,100vh);margin:auto}
  #status{position:fixed;left:8px;top:8px;font:12px monospace;color:#555}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="status">rendering…</div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const P = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
const SIZE = P("size", 1400);
const shape = q.get("shape") || "ribbon";
const save = q.get("save");

// Brand colours (from SAS logo)
const SKY = new THREE.Color("#" + (q.get("sky") || "57b9ff"));
const NAVY = new THREE.Color("#00202e");
const PEARL = new THREE.Color("#eaf6ff");

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE, false);
renderer.toneMapping = { neutral: THREE.NeutralToneMapping, aces: THREE.ACESFilmicToneMapping, agx: THREE.AgXToneMapping, none: THREE.NoToneMapping }[q.get("tm") || "neutral"];
renderer.toneMappingExposure = P("exp", 1.0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = P("env", 1.0);

const key = new THREE.DirectionalLight(0xffffff, P("key", 1.6));
key.position.set(-3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, P("rim", 0.8));
rim.position.set(4, -2, -3);
scene.add(rim);

// Sweep a rounded-rectangle cross-section along a closed curve with a twist.
function sweep({ curve, twist, width, thick, nu = 900, nv = 72, colorAt }) {
  const pos = [], col = [], idx = [];
  const T = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3();
  const up = new THREE.Vector3(0, 0, 1);
  const se = (a, n) => Math.sign(a) * Math.pow(Math.abs(a), n);
  // parallel-ish frame: use fixed up vector projected (curve never aligns with up)
  for (let i = 0; i <= nu; i++) {
    const u = (i / nu) * Math.PI * 2;
    const p = curve(u);
    const p2 = curve(u + 1e-3);
    T.subVectors(p2, p).normalize();
    N.copy(up).sub(T.clone().multiplyScalar(up.dot(T))).normalize();
    B.crossVectors(T, N).normalize();
    const ang = twist(u);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const w = width(u), t = thick(u);
    const c = colorAt(u);
    for (let j = 0; j <= nv; j++) {
      const v = (j / nv) * Math.PI * 2;
      // superellipse (rounded rect) profile
      let x = se(Math.cos(v), 0.35) * w, y = se(Math.sin(v), 0.35) * t;
      const xr = x * ca - y * sa, yr = x * sa + y * ca;
      pos.push(p.x + N.x * xr + B.x * yr, p.y + N.y * xr + B.y * yr, p.z + N.z * xr + B.z * yr);
      // subtle cross-section shading: edges slightly lighter
      const edge = Math.abs(Math.cos(v));
      const cc = c.clone().lerp(PEARL, 0.12 * edge * edge);
      col.push(cc.r, cc.g, cc.b);
    }
  }
  for (let i = 0; i < nu; i++)
    for (let j = 0; j < nv; j++) {
      const a = i * (nv + 1) + j, b = (i + 1) * (nv + 1) + j;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const grad = (u, phase = 0) => {
  const k = 0.5 + 0.5 * Math.cos(u + phase); // 1 = sky, 0 = navy
  const s = THREE.MathUtils.smoothstep(k, 0.15, 0.85);
  return NAVY.clone().lerp(SKY, s);
};

const mat = new THREE.MeshPhysicalMaterial({
  vertexColors: true,
  roughness: P("rough", 0.22),
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: P("ccr", 0.06),
  iridescence: P("irid", 0.25),
  iridescenceIOR: 1.4,
  sheen: P("sheen", 0.0),
  sheenColor: new THREE.Color("#cfeaff"),
  side: THREE.DoubleSide,
});

const group = new THREE.Group();
scene.add(group);

if (shape === "ribbon") {
  // Wavy loop with three half-twists: one continuous surface ("air that never stops")
  const R = 1.0;
  const curve = (u) => new THREE.Vector3(
    (R + 0.18 * Math.sin(3 * u)) * Math.cos(u),
    (R + 0.18 * Math.sin(3 * u)) * Math.sin(u),
    0.32 * Math.sin(2 * u)
  );
  group.add(new THREE.Mesh(sweep({
    curve,
    twist: (u) => 1.5 * u,
    width: (u) => 0.30 + 0.06 * Math.cos(2 * u),
    thick: () => 0.055,
    colorAt: (u) => grad(u, 0.6),
  }), mat));
} else if (shape === "double") {
  // Two strands (sky + navy) braided around a ring — a 3D read of the logo's two waves
  const R = 1.0;
  for (const s of [0, Math.PI]) {
    const curve = (u) => {
      const a = 3 * u + s, r = R + 0.22 * Math.cos(a);
      return new THREE.Vector3(r * Math.cos(u), r * Math.sin(u), 0.22 * Math.sin(a));
    };
    group.add(new THREE.Mesh(sweep({
      curve,
      twist: (u) => 3 * u + s + Math.PI / 2,
      width: () => 0.17,
      thick: () => 0.075,
      colorAt: () => (s === 0 ? SKY.clone() : NAVY.clone().lerp(SKY, 0.08)),
    }), mat));
  }
}

group.rotation.set(P("rx", -0.95), P("ry", 0.25), P("rz", 0.4));

const camera = new THREE.PerspectiveCamera(P("fov", 28), 1, 0.1, 100);
camera.position.set(0, 0, P("dist", 5.2));
camera.lookAt(0, 0, 0);

renderer.render(scene, camera);
const status = document.getElementById("status");
status.textContent = "done";
if (save) {
  const data = renderer.domElement.toDataURL("image/png");
  fetch(`/save?name=${save}`, { method: "POST", body: data })
    .then((r) => r.text())
    .then((t) => (status.textContent = t));
}
</script>
</body>
</html>
